[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-freecad"
version = "0.4.0"
description = "Local MCP tools for live and headless FreeCAD modeling"
requires-python = ">=3.11"
dependencies = ["mcp==2.3.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.17,<0.18"]
api = ["openai>=2,<3"]

[project.scripts]
codex-freecad = "codex_freecad.server:main"
codex-freecad-setup = "codex_freecad.setup:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["native: requires a real FreeCAD installation"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
