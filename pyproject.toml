[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-freecad"
version = "26.1023.101500"
description = "Local MCP tools for live and headless FreeCAD modeling."
requires-python = ">=3.11"
dependencies = ["mcp==2.3.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.17,<0.18", "tzdata; sys_platform == 'win32'"]
api = ["openai>=2,<3"]
managed = ["universal-codex-tools==0.20.0", "pywin32==312; sys_platform == 'win32'"]

[project.scripts]
codex-freecad = "codex_freecad.server:main"
codex-freecad-setup = "codex_freecad.setup:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codex_freecad = ["extensions/*/*.json", "standalone_skill.md", "standalone_offline_skill.md", "guidance/*.md", "release.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "native: requires a real FreeCAD installation",
    "framework: requires FREECAD_FRAMEWORK_PYTHON pointing to an isolated app-host runtime",
    "resource_process: explicit harmless non-MCP Python process fixtures in a private registry",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
