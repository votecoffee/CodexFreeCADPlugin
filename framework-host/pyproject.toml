[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "freecad-mcp-host"
version = "26.1023.104110"
description = "Experimental app-owned stable MCP host for FreeCADMCPServer"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["universal-codex-tools==0.20.0", "mcp==2.3.0"]

[project.scripts]
freecad-mcp-host = "freecad_mcp_host.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
freecad_mcp_host = ["release.json"]
