[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "freecad-mcp-host"
version = "0.1.0"
description = "Experimental app-owned stable MCP host for FreeCADMCPServer"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["universal-codex-tools==0.13.0"]

[project.scripts]
freecad-mcp-host = "freecad_mcp_host.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
